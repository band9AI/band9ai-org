name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "scripts/build-sitemap.py"
      - ".github/workflows/sitemap.yml"

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build-sitemap.py
      - name: Commit sitemap if pages changed
        run: |
          git diff --quiet sitemap.xml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap from indexable pages."
          git push
